name: Verkenning Wintervlam (tijdelijk)
on:
  push:
    branches: [claude/project-thread-62i53a]
    paths: [scripts/probe_wintervlam.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: python3 -m venv /tmp/v && /tmp/v/bin/pip install -q pillow
      - run: /tmp/v/bin/python scripts/probe_wintervlam.py c
      - name: Voorbeelden vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/
          git commit -m "Tijdelijke fotovoorbeelden" || exit 0
          git pull --rebase
          git push
