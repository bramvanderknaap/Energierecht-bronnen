name: Bronnen verkennen
on:
  workflow_dispatch:
    inputs:
      urls:
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in ${{ inputs.urls }}; do
            echo "===== $u"
            curl -sL -A "Mozilla/5.0" "$u" > page.html
            grep -oiE '<meta[^>]*(date|time|published)[^>]*>' page.html | head
            grep -oiE '<time[^>]*>[^<]*' page.html | head
            grep -oiE '.{80}(20(25|26))[^0-9].{40}' page.html | grep -viE 'script|\.js|\.css|href' | head -15
          done
