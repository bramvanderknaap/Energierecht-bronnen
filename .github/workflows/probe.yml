name: Bronnen verkennen
on:
  workflow_dispatch:
    inputs:
      urls:
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in ${{ inputs.urls }}; do
            echo "===== $u"
            curl -sL -A "Mozilla/5.0" "$u" > page.html
            echo "bytes: $(wc -c < page.html)"
            grep -oiE '<meta[^>]*(date|time|published|modified)[^>]*>' page.html | head
            grep -oiE '"date(Published|Modified|Created)"[^,]*' page.html | head -3
            grep -oiE '<time[^>]*>[^<]*' page.html | head -5
            grep -oiE '.{60}[0-9]{1,2} (January|February|March|April|May|June|July|August|September|October|November|December) 20[0-9]{2}.{20}' page.html | head -5
          done
