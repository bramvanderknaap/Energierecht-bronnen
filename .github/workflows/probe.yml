name: Verkenning rechtspraak (tijdelijk)
on:
  push:
    branches: [claude/project-thread-62i53a]
    paths: [scripts/probe_rechtspraak.py, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_rechtspraak.py
      - run: df -h / | tail -1
