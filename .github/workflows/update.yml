name: Publicaties bijwerken

on:
  schedule:
    - cron: "0 5 * * *"   # elke dag om 05:00 UTC
  workflow_dispatch:       # handmatig starten kan ook
  push:
    branches: [main]
    paths: [sources.json, scripts/**]

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verkenning HvJ
        run: python scripts/probe_hvj.py
