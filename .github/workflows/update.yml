name: Publicaties bijwerken

on:
  schedule:
    - cron: "0 5 * * *"   # elke dag om 05:00 UTC
  workflow_dispatch:       # handmatig starten kan ook
  push:
    branches: [main]
    paths: [sources.json, scripts/**]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicaties ophalen
        run: python scripts/fetch.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet || git commit -m "Publicaties bijgewerkt"
          git push
