<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Energierecht Bronnen</title>
  <meta name="description" content="Dagelijks bijgewerkt overzicht van publicaties en rechtsbronnen over energierecht: ACM, ACER, Europese Commissie, CEER, Rijksoverheid en CBb.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <p class="eyebrow">Rechtsbronnen · Nederland &amp; Europese Unie</p>
      <h1><span class="para" aria-hidden="true">§</span> Energierecht Bronnen</h1>
      <p class="lead">Nieuwe publicaties en vaste rechtsbronnen over energierecht op één plek. Elke dag automatisch bijgewerkt.</p>
      <p class="meta" id="updated"></p>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="nieuw">Nieuwste publicaties</button>
      <button role="tab" aria-selected="false" data-tab="bronnen">Bronnen &amp; vaste links</button>
    </nav>

    <section id="nieuw">
      <div class="controls">
        <input type="search" id="zoek" placeholder="Zoek in titels, bijv. ‘netcode’ of ‘tarief’" aria-label="Zoeken">
        <div class="chips" id="chips"></div>
      </div>
      <p class="count" id="count"></p>
      <ol class="items" id="items"></ol>
      <button class="more" id="more" hidden>Meer tonen</button>
    </section>

    <section id="bronnen" hidden>
      <div class="sources" id="sources"></div>
    </section>
  </main>

  <footer class="wrap foot">
    Automatisch verzameld uit openbare bronnen. Controleer altijd de originele publicatie.
  </footer>

  <script>window.EB_DATA = window.EB_DATA || null;</script>
  <script src="app.js"></script>
</body>
</html>
